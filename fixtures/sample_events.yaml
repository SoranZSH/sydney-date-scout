# ==========================================================
# 离线演示样例 —— 供 `python run.py run --dry-run` 跑通全链路。
#
# 用 start_offset_days（相对"现在"的天数）+ start_time 而不是绝对日期，
# 这样样例永远落在 lookahead_days 窗口内，不会因为时间流逝而"过期"。
#
# 覆盖：5 条应达标推荐、3 条应核验通过但未达标、1 条应因约会氛围低于
# 下限被一票否决、2 条应因电竞/动漫被硬排除、1 条应因超预算剔除、
# 2 条应因超距离剔除 —— 一共 13 条，加上 sources.yaml 里的 astro 源 1 条，
# 合计 14 条，用来验证 README 描述的漏斗数字。
# ==========================================================

